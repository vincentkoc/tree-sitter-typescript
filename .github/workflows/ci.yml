name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Native and Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: (cd node_modules/tree-sitter-cli && node install.js)
      - name: Verify generated parsers
        run: |
          (cd typescript && ../node_modules/.bin/tree-sitter generate --abi 14)
          (cd tsx && ../node_modules/.bin/tree-sitter generate --abi 14)
          git diff --exit-code -- typescript/src tsx/src
      - run: node_modules/.bin/tree-sitter test
      - run: python -m pip install 'tree-sitter==0.25.2' .
      - run: python -m unittest discover -s bindings/python/tests -v
